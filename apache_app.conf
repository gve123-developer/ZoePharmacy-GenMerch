<Directory "${HEROKU_APP_DIR}">
    RewriteEngine On

    # 1. Allow direct access to PHP API and includes
    RewriteRule ^(api|includes) - [L]

    # 2. If the file exists in /dist, serve it from /dist
    RewriteCond %{DOCUMENT_ROOT}/dist%{REQUEST_URI} -f
    RewriteRule ^(.*)$ /dist/$1 [L]

    # 3. Otherwise, for any other request (like /, /dashboard, etc), serve /dist/index.html
    RewriteCond %{REQUEST_URI} !^/api/
    RewriteCond %{REQUEST_URI} !^/includes/
    RewriteRule ^(.*)$ /dist/index.html [L]
</Directory>
