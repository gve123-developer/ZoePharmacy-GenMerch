<Directory "${HEROKU_APP_DIR}">
    RewriteEngine On

    # 1. Allow direct access to PHP API and includes
    RewriteCond %{REQUEST_URI} ^/api/ [OR]
    RewriteCond %{REQUEST_URI} ^/includes/
    RewriteRule ^ - [L]

    # 2. Serve static compiled assets from dist/
    RewriteCond %{DOCUMENT_ROOT}/dist%{REQUEST_URI} -f
    RewriteRule ^(.+)$ /dist/$1 [L]

    # 3. Route all remaining page requests to dist/index.html
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^.*$ /dist/index.html [L]
</Directory>
